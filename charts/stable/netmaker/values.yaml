replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: gravitl/netmaker
  tag: v0.20.1
  pullPolicy: IfNotPresent
services:
  - name: grpc
    port: 50051
    targetPort: "50051"
    protocol: TCP
  - name: api
    port: 8081
    targetPort: "8081"
    protocol: TCP
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env:
  env1:
    name: SERVER_HOST
    value: netmaker.example.com
