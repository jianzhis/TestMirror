replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: gravitl/netmaker
  tag: v0.20.2
  pullPolicy: IfNotPresent
services:
  - name: ui
    port: 8082
    targetPort: "8082"
    protocol: TCP
  - name: api
    port: 8081
    targetPort: "8081"
    protocol: TCP
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env:
  env1:
    name: MASTER_KEY
    value: secretkey
  env2:
    name: NETMAKER_BASE_DOMAIN
    value: localhost
  env3:
    name: SERVER_HOST
    value: localhost
  env4:
    name: API_PORT
    value: "8081"
  env5:
    name: CORS_ALLOWED_ORIGIN
    value: http://localhost:8082
