apiVersion: apps/v1
kind: Deployment
metadata:
 name: {{ include "photoprism.fullname" . }}
 labels:
   {{- include "photoprism.labels" . | nindent 4 }}
spec:
 replicas: {{ .Values.replicaCount }}
 selector:
   matchLabels:
     {{- include "photoprism.selectorLabels" . | nindent 6 }}
 template:
   metadata:
     labels:
       {{- include "photoprism.labels" . | nindent 8 }}
       {{- include "photoprism.selectorLabels" . | nindent 8 }}
   spec:
     containers:
       - name: {{ include "photoprism.name" . }}
         image: "{{ .Values.image.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
         imagePullPolicy: {{ .Values.image.pullPolicy }}
         ports:
           - containerPort: {{ .Values.service.port }}
         env:
           {{- if kindIs "array" .Values.env }}
           {{- range .Values.env }}
           - name: "{{ .name }}"
             value: "{{ .value }}"
           {{- end }}
           {{- else if kindIs "map" .Values.env }}
           {{- range $key, $value := .Values.env }}
           - name: "{{ $value.name }}"
             value: "{{ $value.value }}"
           {{- end }}
           {{- end }}
         resources:
           {{- toYaml .Values.resources | nindent 12 }}
         volumeMounts:
           - name: {{ .Chart.Name }}-data
             mountPath: /app/data
     volumes:
       - name: {{ .Chart.Name }}-data
         persistentVolumeClaim:
           claimName: {{ include "photoprism.fullname" . }}-pvc