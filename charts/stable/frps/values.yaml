replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: fatedier/frps
  tag: v0.61.1
  pullPolicy: IfNotPresent
services:
  - name: dashboard
    port: 7500
    targetPort: "7500"
    protocol: TCP
    type: NodePort # 设置为 NodePort 以支持外部访问
    nodePort: 30075 # 仪表盘外部访问端口
    description: FRPS 仪表盘服务，用于监控和管理。
  - name: proxy
    port: 7000
    targetPort: "7000"
    protocol: TCP
    type: NodePort # 设置为 NodePort 以支持外部访问
    nodePort: 30070 # 代理服务外部访问端口
    description: FRPS 代理服务，接受客户端连接。
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env:
  - name: FRPS_DASHBOARD_PORT
    value: "7500"
  - name: FRPS_TOKEN
    value: "随便你填个你记得住的密码"
  - name: FRPS_BIND_PORT
    value: "7000"
resources:
  limits:
    cpu: "500m" # 限制容器最多使用 500m CPU
    memory: "256Mi" # 限制容器最多使用 256Mi 内存
  requests:
    cpu: "250m" # 容器启动时请求分配 250m CPU
    memory: "128Mi" # 容器启动时请求分配 128Mi 内存
