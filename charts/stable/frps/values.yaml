replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: snowdreamtech/frps
  tag: 0.51.3
  pullPolicy: IfNotPresent
services:
  - name: server
    port: 7000
    targetPort: "7000"
    protocol: TCP
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env: {}
