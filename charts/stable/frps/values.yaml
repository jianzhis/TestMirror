replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: fatedier/frps
  tag: v0.61.1
  pullPolicy: IfNotPresent
services:
  - name: server
    port: 7000
    targetPort: "7000"
    protocol: TCP
  - name: ui
    port: 7500
    targetPort: "7500"
    protocol: TCP
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env:
  env1:
    name: DASHBOARD_PORT
    value: "7500"
  env2:
    name: DASHBOARD_USER
    value: admin
  env3:
    name: DASHBOARD_PWD
    value: admin
  env4:
    name: DASHBOARD_ADDR
    value: 0.0.0.0
  env5:
    name: DASHBOARD_BIND_PORT
    value: "7500"
