replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: snowdreamtech/frps
  tag: latest
  pullPolicy: IfNotPresent
services:
  - name: bind-port
    port: 7000
    targetPort: "7000"
    protocol: TCP
  - name: dashboard
    port: 7500
    targetPort: "7500"
    protocol: TCP
  - name: vhost-http
    port: 80
    targetPort: "80"
    protocol: TCP
  - name: vhost-https
    port: 443
    targetPort: "443"
    protocol: TCP
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
env:
  env1:
    name: FRP_TOKEN
    value: "12345678"
  env2:
    name: FRP_DASHBOARD_USER
    value: admin
  env3:
    name: FRP_DASHBOARD_PWD
    value: admin
