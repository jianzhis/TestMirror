apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sidecar-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRole
metadata:
  name: {{ include "sidecar-plugin.fullname" . }}
rules:
# Access to pluginconfigs
- apiGroups: ["sidecar.yunna.net"]
  resources: ["pluginconfigs"]
  verbs: ["*"]
# Access to k8s workloads  
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
# Access to workload configs
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sidecar-plugin.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "sidecar-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "sidecar-plugin.fullname" . }}
  apiGroup: rbac.authorization.k8s.io