apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sidecar-plugin.fullname" . }}
  labels:
    {{- include "sidecar-plugin.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sidecar-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sidecar-plugin.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sidecar-plugin.fullname" . }}
      containers:
      - name: sidecar
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080