apiVersion: v1
kind: Service
metadata:
 name: {{ include "ark-server.fullname" . }}
 labels:
   {{- include "ark-server.labels" . | nindent 4 }}
spec:
 type: ClusterIP
 ports:
   {{- range .Values.services }}
   - name: {{ .name }}
     port: {{ .port }}
     targetPort: {{ .targetPort }}
     protocol: {{ .protocol }}
   {{- end }}
 selector:
   {{- include "ark-server.selectorLabels" . | nindent 4 }}