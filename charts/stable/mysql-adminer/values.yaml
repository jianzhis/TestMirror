replicaCount: 1
image:
  imageRegistry: registry-2.yunna.net
  repository: adminer
  tag: latest
  pullPolicy: IfNotPresent
services:
  - name: web
    port: 8080
    targetPort: '8080'
    protocol: TCP
  - name: mysql
    port: 3306
    targetPort: '3306'
    protocol: TCP
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: local
  mountPath: /app/data
env:
  '# 默认连接的数据库服务器': null
  env1:
    name: ADMINER_DEFAULT_SERVER
    value: '"localhost"'
  '# MySQL root用户密码': null
  env2:
    name: MYSQL_ROOT_PASSWORD
    value: '"admin123"'
  '# 默认创建的数据库名': null
  env3:
    name: MYSQL_DATABASE
    value: '"mydb"'
  '# 创建的普通用户名': null
  env4:
    name: MYSQL_USER
    value: '"admin"'
  '# 普通用户密码': null
  env5:
    name: MYSQL_PASSWORD
    value: '"password123"'
